version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped
    networks:
      - midiapp

  frontend:
    build: ./frontend
    ports:
      - "9595:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - midiapp
    depends_on:
      - backend

networks:
  midiapp:
    driver: bridge
